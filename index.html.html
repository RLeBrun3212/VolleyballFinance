<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>UNH Men's Volleyball – Team Finances</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1a2230;--mu:#667085;--bd:#e3e6eb;--ac:#0b3a75;--g:#0a7a3d;--r:#b42318;--bar:#c9d8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#11151c;--card:#1a212b;--tx:#e8ebf0;--mu:#98a2b3;--bd:#2b3441;--ac:#7fb0f5;--g:#4cc28a;--r:#f47c72;--bar:#2a3f5f}}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:1000px;margin:0 auto;padding:14px}h1{font-size:20px;margin:6px 0 2px}h2{font-size:16px;margin:0 0 10px}.mu{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}nav button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:8px;cursor:pointer;font:inherit}nav button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.big{font-size:26px;font-weight:700}.pos{color:var(--g)}.neg{color:var(--r)}.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13.5px}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--bd);vertical-align:top}th{color:var(--mu);font-weight:600;white-space:nowrap}td.n,th.n{text-align:right;white-space:nowrap}
input,select,button.b{font:inherit;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}input[type=number]{width:105px}input.w{width:100%}button.b{cursor:pointer;background:var(--ac);color:#fff;border-color:var(--ac)}button.b.s{background:var(--card);color:var(--tx);border-color:var(--bd)}button.b.d{background:none;color:var(--r);border-color:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:end}.row label{display:flex;flex-direction:column;font-size:12px;color:var(--mu);gap:3px}.bar{height:8px;background:var(--bar);border-radius:4px;min-width:2px}textarea{width:100%;height:70px;font:12px monospace;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:8px}
</style></head><body><main>
<h1>UNH Men's Volleyball Club – Team Finances</h1><div class="mu">Fiscal year 2027 (July 2026 – June 2027) · last year's history (FY26) used for planning</div>
<nav id="nav"></nav><div id="app"></div></main>
<script>
// PASTE YOUR MASSIVE TRANSACTION HISTORY LINE DIRECTLY ON THE BLANK LINE BELOW:
<h1>UNH Men's Volleyball Club – Team Finances</h1><div class="mu">Fiscal year 2027 (July 2026 – June 2027) · last year's history (FY26) used for planning</div>
if(typeof FY26==='undefined'){var FY26=[];}

const K='uvb-fin-v1',FN={SP:'Specific Purpose',GF:'Gift Fund'};
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cl=n=>n<0?'neg':'pos',R=n=>Math.round(n*100)/100,uid=()=>Math.random().toString(36).slice(2,9);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const def=()=>({start:{SP:10289.42,GF:2155.72},tx:[],tpls:[{id:'dues',name:'Player dues',fund:'SP',dir:'in',amt:300,count:18,cat:'Player dues'}],names:{},budget:{},ad:today()});
let st;try{st=JSON.parse(localStorage.getItem(K))||def()}catch(e){st=def()}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(st))}catch(e){}};
let tab='ov',lyF='SP',q='',lgF='ALL';

const bal=f=>R(st.start[f]+st.tx.filter(t=>t.fund===f).reduce((a,t)=>a+t.amt,0));
const sumBy=(rows,k,fn)=>{const m={};rows.filter(r=>r[7]===k).forEach(r=>m[r[3]]=R((m[r[3]]||0)+fn(r)));return m};
const expCats=()=>{const m={};FY26.filter(r=>r[7]==='o').forEach(r=>m[r[3]]=R((m[r[3]]||0)-r[2]));st.tx.forEach(t=>{if(t.amt<0&&!(t.cat in m))m[t.cat]=0});return m};
const allCats=()=>[...new Set([...FY26.map(r=>r[3]),...st.tx.map(t=>t.cat),'Player dues','Other'])].sort();
const spent=c=>R(-st.tx.filter(t=>t.cat===c).reduce((a,t)=>a+t.amt,0));
const bud=(c,l)=>c in st.budget?st.budget[c]:Math.round(l);
const insts=()=>{const o=[];st.tpls.forEach(p=>{for(let i=1;i<=p.count;i++){const id=p.id+'-'+i;o.push({id,p,i,tx:st.tx.find(t=>t.src===id)})}});return o};
const pending=()=>insts().filter(x=>!x.tx);
const bars=(m,sign)=>{const e=Object.entries(m).filter(x=>x[1]!==0).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...e.map(x=>x[1]));return '<table>'+e.map(([c,v])=>`<tr><td>${esc(c)}</td><td style="width:38%"><div class="bar" style="width:${Math.max(1,v/mx*100)}%"></div></td><td class="n">${fmt(v)}</td></tr>`).join('')+'</table>'};

function ov(){const tot=bal('SP')+bal('GF'),pi=pending().filter(x=>x.p.dir==='in').reduce((a,x)=>a+x.p.amt,0),po=pending().filter(x=>x.p.dir==='out').reduce((a,x)=>a+x.p.amt,0);
const ec=expCats();const rem=Object.entries(ec).reduce((a,[c,l])=>a+Math.max(0,bud(c,l)-spent(c)),0);
const fy=f=>{const r=FY26.filter(x=>x[1]===f),i=r.filter(x=>x[7]==='i').reduce((a,x)=>a+x[2],0),o=-r.filter(x=>x[7]==='o').reduce((a,x)=>a+x[2],0);return `<div class="card"><h2>${FN[f]} – last year (FY26)</h2><div class="mu">Money in</div><b class="pos">${fmt(i)}</b> · <span class="mu">Money out</span> <b class="neg">${fmt(-o)}</b> · <span class="mu">Net</span> <b class="${cl(i-o)}">${fmt(i-o)}</b></div>`};
return `<div class="grid"><div class="card"><div class="mu">Specific Purpose balance</div><div class="big ${cl(bal('SP'))}">${fmt(bal('SP'))}</div></div><div class="card"><div class="mu">Gift Fund balance</div><div class="big ${cl(bal('GF'))}">${fmt(bal('GF'))}</div></div><div class="card"><div class="mu">Total across both</div><div class="big">${fmt(tot)}</div></div></div>
<div class="card"><h2>Projected year-end</h2><table><tr><td>Balance today</td><td class="n">${fmt(tot)}</td></tr><tr><td>+ Expected money in not yet received</td><td class="n pos">${fmt(pi)}</td></tr><tr><td>− Expected money out not yet paid</td><td class="n neg">${fmt(-po)}</td></tr><tr><td>− Budget still unspent (Planner tab)</td><td class="n neg">${fmt(-rem)}</td></tr><tr><td><b>Projected year-end balance</b></td><td class="n"><b class="${cl(tot+pi-po-rem)}">${fmt(tot+pi-po-rem)}</b></td></tr></table><div class="mu">The Planner starts with last year's spending as the budget — edit it to match this year's plans.</div></div>
<div class="grid">${fy('SP')}${fy('GF')}</div>
<div class="card"><h2>Starting balances (start of FY27)</h2><div class="row"><label>Specific Purpose<input type="number" step="0.01" data-s="SP" value="${st.start.SP}"></label><label>Gift Fund<input type="number" step="0.01" data-s="GF" value="${st.start.GF}"></label></div></div>
<div class="card"><h2>Backup / move to another device</h2><div class="mu">Your entries are saved in this browser only. Copy this text somewhere safe; paste it back here to restore.</div><textarea id="bk">${esc(JSON.stringify(st))}</textarea><div class="row" style="margin-top:6px"><button class="b s" data-a="copy">Copy</button><button class="b s" data-a="restore">Restore from text</button><button class="b d" data-a="reset">Reset everything</button></div></div>`}

function planner(){const ec=expCats();let t1=0,t2=0,t3=0;const rows=Object.entries(ec).sort((a,b)=>b[1]-a[1]).map(([c,l])=>{const b=bud(c,l),s=spent(c);t1+=l;t2+=b;t3+=s;return `<tr><td>${esc(c)}</td><td class="n">${fmt(l)}</td><td class="n"><input type="number" step="1" data-b="${esc(c)}" value="${b}"></td><td class="n">${fmt(s)}</td><td class="n ${cl(b-s)}">${fmt(b-s)}</td></tr>`}).join('');
const inc=sumBy(FY26,'i',r=>r[2]);
return `<div class="card"><h2>Where to plan to spend</h2><div class="mu">Last year's spending by category (both funds combined) with an editable budget for this year. "Spent so far" fills in as you add transactions.</div><div class="wrap"><table><tr><th>Category</th><th class="n">Spent FY26</th><th class="n">Budget FY27</th><th class="n">Spent so far</th><th class="n">Remaining</th></tr>${rows}<tr><th>Total</th><th class="n">${fmt(t1)}</th><th class="n">${fmt(t2)}</th><th class="n">${fmt(t3)}</th><th class="n">${fmt(t2-t3)}</th></tr></table></div></div>
<div class="card"><h2>Where money came from last year</h2>${bars(inc)}</div>`}

function ledger(){const rows=st.tx.filter(t=>lgF==='ALL'||t.fund===lgF).sort((a,b)=>b.date.localeCompare(a.date)).map(t=>`<tr><td>${t.date}</td><td>${FN[t.fund]}</td><td>${esc(t.cat)}</td><td>${esc(t.desc)}</td><td class="n ${cl(t.amt)}">${fmt(t.amt)}</td><td><button class="b d" data-a="del" data-id="${t.id}">✕</button></td></tr>`).join('');
return `<div class="card"><h2>Add a transaction</h2><div class="row"><label>Fund<select id="nf"><option value="SP">Specific Purpose</option><option value="GF">Gift Fund</option></select></label><label>Date<input type="date" id="nd" value="${today()}"></label><label>Money in or out<select id="nt"><option value="in">Money IN (+)</option><option value="out">Money OUT (−)</option></select></label><label>Category<input id="nc" list="cats" placeholder="Pick or type"></label><label>Amount ($)<input type="number" step="0.01" min="0" id="na"></label><label style="flex:1;min-width:160px">Description<input class="w" id="ne" placeholder="What was it for?"></label><button class="b" data-a="add">Add</button></div><datalist id="cats">${allCats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
Use code with caution.
This year's transactionsBoth funds<option value="SP" ${lgF==='SP'?'selected':''}>Specific Purpose<option value="GF" ${lgF==='GF'?'selected':''}>Gift Fund${rows?<div class="wrap"><table><tr><th>Date</th><th>Fund</th><th>Category</th><th>Description</th><th class="n">Amount</th><th></th></tr>${rows}</table></div>:'Nothing yet. Add one above, or approve an expected transaction.'}`}
function expected(){const ps=st.tpls.map(p=><tr><td><input class="w" data-t="${p.id}" data-f="name" value="${esc(p.name)}"></td><td><select data-t="${p.id}" data-f="fund"><option value="SP" ${p.fund==='SP'?'selected':''}>Specific Purpose</option><option value="GF" ${p.fund==='GF'?'selected':''}>Gift Fund</option></select></td><td><select data-t="${p.id}" data-f="dir"><option value="in" ${p.dir==='in'?'selected':''}>In (+)</option><option value="out" ${p.dir==='out'?'selected':''}>Out (−)</option></select></td><td><input type="number" step="0.01" data-t="${p.id}" data-f="amt" value="${p.amt}"></td><td><input type="number" min="0" step="1" style="width:70px" data-t="${p.id}" data-f="count" value="${p.count}"></td><td><button class="b d" data-a="deltpl" data-id="${p.id}">✕</button></td></tr>).join('');
const ins=insts().map(x=>{const nm=st.names[x.id]||'';return <tr><td>${esc(x.p.name)} #${x.i}</td><td><input data-n="${x.id}" placeholder="Name (optional)" value="${esc(nm)}"></td><td>${FN[x.p.fund]}</td><td class="n ${x.p.dir==='in'?'pos':'neg'}">${fmt(x.p.dir==='in'?x.p.amt:-x.p.amt)}</td><td>${x.tx?✓ received ${x.tx.date} Undo:Approve}</td></tr>}).join('');
return <div class="card"><h2>Expected transactions (templates)</h2><div class="mu">Edit the amount or number of people any time — this changes the pending items below. Each person/item is its own separate transaction.</div><div class="wrap"><table><tr><th>Name</th><th>Fund</th><th>Direction</th><th>Amount each</th><th>How many</th><th></th></tr>${ps}</table></div><div class="row" style="margin-top:8px"><button class="b s" data-a="addtpl">+ Add expected transaction</button><label>Date recorded on approval<input type="date" id="ad" value="${st.ad||today()}"></label><button class="b" data-a="apprall">Approve all pending (${pending().length})</button></div></div> <div class="card"><h2>Pending &amp; received</h2><div class="wrap"><table><tr><th>Item</th><th>Who</th><th>Fund</th><th class="n">Amount</th><th>Status</th></tr>${ins||'<tr><td class="mu">No expected transactions.</td></tr>'}</table></div></div>}
function last(){const r=FY26.filter(x=>x[1]===lyF),m=q.toLowerCase(),vis=r.filter(x=>!m||x.join(' ').toLowerCase().includes(m)),i=sumBy(r,'i',x=>x[2]),o=sumBy(r,'o',x=>-x[2]);
return <div class="card"><div class="row"><h2 style="margin:0">Last year (FY26)</h2><select id="lyf"><option value="SP" ${lyF==='SP'?'selected':''}>Specific Purpose</option><option value="GF" ${lyF==='GF'?'selected':''}>Gift Fund</option></select></div><div class="mu" style="margin-top:6px">Last Year Data Visuals Active</div></div> <div class="grid"><div class="card"><h2>Money in</h2>${bars(i)}</div><div class="card"><h2>Money out</h2>${bars(o)}</div></div> <div class="card"><div class="row" style="justify-content:space-between"><h2>Every transaction (${vis.length})</h2><input id="q" placeholder="Search…" value="${esc(q)}"></div><div class="wrap"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>From / to</th><th>Reference</th><th class="n">Amount</th></tr>${vis.map(x=>${x[0]}${esc(x[3])}${esc(x[4])}${esc(x[5])}${esc(x[6])}${fmt(x[2])}).join('')}</table></div></div>}
const TABS=[['ov','Overview',ov],['pl','Planner',planner],['lg','This year',ledger],['ex','Expected',expected],['ly','Last year',last]];
function render(){$n=document.getElementById('nav');$n.innerHTML=TABS.map(t=><button class="${tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>).join('');document.getElementById('app').innerHTML=TABS.find(t=>t[0]===tab)2}
function addTx(o){st.tx.push(Object.assign({id:uid()},o));save()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;return render()}const a=b.dataset.a,id=b.dataset.id;if(!a)return;
if(a==='add'){const v=k=>document.getElementById(k).value,amt=parseFloat(v('na'));if(!(amt>0)||!v('nc').trim())return alert('Please enter a category and an amount greater than 0.');addTx({date:v('nd')||today(),fund:v('nf'),amt:R(v('nt')==='in'?amt:-amt),cat:v('nc').trim(),desc:v('ne').trim()||v('nc').trim()})}
else if(a==='del'){st.tx=st.tx.filter(t=>t.id!==id);save()}
else if(a==='addtpl'){st.tpls.push({id:uid(),name:'New expected item',fund:'SP',dir:'out',amt:0,count:1,cat:'Other'});save()}
else if(a==='deltpl'){st.tpls=st.tpls.filter(p=>p.id!==id);st.tx.forEach(t=>{if(t.src&&t.src.startsWith(id+'-'))delete t.src});save()}
else if(a==='appr'||a==='apprall'){const d=(document.getElementById('ad')||{}).value||today();st.ad=d;(a==='appr'?pending().filter(x=>x.id===id):pending()).forEach(x=>{const nm=st.names[x.id];addTx({date:d,fund:x.p.fund,amt:R(x.p.dir==='in'?x.p.amt:-x.p.amt),cat:x.p.cat||x.p.name,desc:x.p.name+(nm?' – '+nm:' #'+x.i),src:x.id})})}
else if(a==='undo'){st.tx=st.tx.filter(t=>t.src!==id);save()}
else if(a==='copy'){const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(){}return}
else if(a==='restore'){try{const j=JSON.parse(document.getElementById('bk').value);if(!j.start||!j.tx)throw 0;st=j;save()}catch(){return alert('That text is not a valid backup.')}}
else if(a==='reset'){if(!confirm('Erase all entries and settings?'))return;st=def();save()}
render()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.s)st.start[d.s]=parseFloat(t.value)||0;
else if(d.b)st.budget[d.b]=parseFloat(t.value)||0;
else if(d.n)st.names[d.n]=t.value;
else if(d.t){const p=st.tpls.find(x=>x.id===d.t);const f=d.f;p[f]=(f==='amt')?(parseFloat(t.value)||0):(f==='count')?Math.max(0,parseInt(t.value)||0):t.value;if(f==='name'&&p.cat===undefined)p.cat=t.value}
else if(t.id==='lgf')lgF=t.value;else if(t.id==='lyf')lyF=t.value;else if(t.id==='ad')st.ad=t.value;else return;
save();render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
render();
