return `<div class="card"><h2>Add a transaction</h2><div class="row"><label>Fund<select id="nf"><option value="SP">Specific Purpose</option><option value="GF">Gift Fund</option></select></label><label>Date<input type="date" id="nd" value="${today()}"></label><label>Money in or out<select id="nt"><option value="in">Money IN (+)</option><option value="out">Money OUT (−)</option></select></label><label>Category<input id="nc" list="cats" placeholder="Pick or type"></label><label>Amount ($)<input type="number" step="0.01" min="0" id="na"></label><label style="flex:1;min-width:160px">Description<input class="w" id="ne" placeholder="What was it for?"></label><button class="b" data-a="add">Add</button></div><datalist id="cats">${allCats().map(c=>`<option value="${esc(c)}">`).join('')}</datalist></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2>This year's transactions</h2><select id="lgf"><option value="ALL">Both funds</option><option value="SP" ${lgF==='SP'?'selected':''}>Specific Purpose</option><option value="GF" ${lgF==='GF'?'selected':''}>Gift Fund</option></select></div>${rows?`<div class="wrap"><table><tr><th>Date</th><th>Fund</th><th>Category</th><th>Description</th><th class="n">Amount</th><th></th></tr>${rows}</table></div>`:'<div class="mu">Nothing yet. Add one above, or approve an expected transaction.</div>'}</div>`}
function expected(){const ps=st.tpls.map(p=>`<tr><td><input class="w" data-t="${p.id}" data-f="name" value="${esc(p.name)}"></td><td><select data-t="${p.id}" data-f="fund"><option value="SP" ${p.fund==='SP'?'selected':''}>Specific Purpose</option><option value="GF" ${p.fund==='GF'?'selected':''}>Gift Fund</option></select></td><td><select data-t="${p.id}" data-f="dir"><option value="in" ${p.dir==='in'?'selected':''}>In (+)</option><option value="out" ${p.dir==='out'?'selected':''}>Out (−)</option></select></td><td><input type="number" step="0.01" data-t="${p.id}" data-f="amt" value="${p.amt}"></td><td><input type="number" min="0" step="1" style="width:70px" data-t="${p.id}" data-f="count" value="${p.count}"></td><td><button class="b d" data-a="deltpl" data-id="${p.id}">✕</button></td></tr>`).join('');
const ins=insts().map(x=>{const nm=st.names[x.id]||'';return `<tr><td>${esc(x.p.name)} #${x.i}</td><td><input data-n="${x.id}" placeholder="Name (optional)" value="${esc(nm)}"></td><td>${FN[x.p.fund]}</td><td class="n ${x.p.dir==='in'?'pos':'neg'}">${fmt(x.p.dir==='in'?x.p.amt:-x.p.amt)}</td><td>${x.tx?`<span class="pos">✓ received ${x.tx.date}</span> <button class="b s" data-a="undo" data-id="${x.id}">Undo</button>`:`<button class="b" data-a="appr" data-id="${x.id}">Approve</button>`}</td></tr>`}).join('');
return `<div class="card"><h2>Expected transactions (templates)</h2><div class="mu">Edit the amount or number of people any time — this changes the pending items below. Each person/item is its own separate transaction.</div><div class="wrap"><table><tr><th>Name</th><th>Fund</th><th>Direction</th><th>Amount each</th><th>How many</th><th></th></tr>${ps}</table></div><div class="row" style="margin-top:8px"><button class="b s" data-a="addtpl">+ Add expected transaction</button><label>Date recorded on approval<input type="date" id="ad" value="${st.ad||today()}"></label><button class="b" data-a="apprall">Approve all pending (${pending().length})</button></div></div>
<div class="card"><h2>Pending &amp; received</h2><div class="wrap"><table><tr><th>Item</th><th>Who</th><th>Fund</th><th class="n">Amount</th><th>Status</th></tr>${ins||'<tr><td class="mu">No expected transactions.</td></tr>'}</table></div></div>`}
function last(){const r=FY26.filter(x=>x[1]===lyF),m=q.toLowerCase(),vis=r.filter(x=>!m||x.join(' ').toLowerCase().includes(m)),i=sumBy(r,'i',x=>x[2]),o=sumBy(r,'o',x=>-x[2]);
return `<div class="card"><div class="row"><h2 style="margin:0">Last year (FY26)</h2><select id="lyf"><option value="SP" ${lyF==='SP'?'selected':''}>Specific Purpose</option><option value="GF" ${lyF==='GF'?'selected':''}>Gift Fund</option></select></div><div class="mu" style="margin-top:6px">${lyF==='SP'?'Specific Purpose (SP000242): team operating money – online store/dues payments, Campus Rec deposits, and most travel.':'Gift Fund (GF001211): restricted donation money from GiveCampus gifts and awards.'} The admin's "FDM Redesign" re-coding entries were left out because they exactly cancel the originals.</div></div>
<div class="grid"><div class="card"><h2>Money in</h2>${bars(i)}</div><div class="card"><h2>Money out</h2>${bars(o)}</div></div>
<div class="card"><div class="row" style="justify-content:space-between"><h2>Every transaction (${vis.length})</h2><input id="q" placeholder="Search…" value="${esc(q)}"></div><div class="wrap"><table><tr><th>Date</th><th>Category</th><th>Description</th><th>From / to</th><th>Reference</th><th class="n">Amount</th></tr>${vis.map(x=>`<tr><td>${x[0]}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td><td>${esc(x[5])}</td><td class="mu">${esc(x[6])}</td><td class="n ${cl(x[2])}">${fmt(x[2])}</td></tr>`).join('')}</table></div></div>`}
const TABS=[['ov','Overview',ov],['pl','Planner',planner],['lg','This year',ledger],['ex','Expected',expected],['ly','Last year',last]];
function render(){$n=document.getElementById('nav');$n.innerHTML=TABS.map(t=>`<button class="${tab===t[0]?'on':''}" data-tab="${t[0]}">${t[1]}</button>`).join('');document.getElementById('app').innerHTML=TABS.find(t=>t[0]===tab)[2]()}

  async function addTx(o){
  const newId = uid();
  const dbPayload = { id: newId, date: o.date, fund: o.fund, amt: o.amt, cat: o.cat, desc: o.desc };
  st.tx.push(dbPayload);
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/tx`, {
      method: 'POST',
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}`, "Content-Type": "application/json" },
      body: JSON.stringify(dbPayload)
    });
  } catch(e) {}
  save(); render();
}
  
document.addEventListener('click', async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tab){tab=b.dataset.tab;return render()}const a=b.dataset.a,id=b.dataset.id;if(!a)return;
if(a==='add'){const v=k=>document.getElementById(k).value,amt=parseFloat(v('na'));if(!(amt>0)||!v('nc').trim())return alert('Please enter a category and an amount greater than 0.');addTx({date:v('nd')||today(),fund:v('nf'),amt:R(v('nt')==='in'?amt:-amt),cat:v('nc').trim(),desc:v('ne').trim()||v('nc').trim()})}

else if(a==='del'){
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/tx?id=eq.${id}`, {
      method: 'DELETE',
      headers: { "apikey": SUPABASE_KEY, "Authorization": `Bearer ${SUPABASE_KEY}` }
    });
  } catch(err){}
  st.tx=st.tx.filter(t=>t.id!==id); save(); render();
}

else if(a==='addtpl'){st.tpls.push({id:uid(),name:'New expected item',fund:'SP',dir:'out',amt:0,count:1,cat:'Other'});save()}
else if(a==='deltpl'){st.tpls=st.tpls.filter(p=>p.id!==id);st.tx.forEach(t=>{if(t.src&&t.src.startsWith(id+'-'))delete t.src});save()}
else if(a==='appr'||a==='apprall'){const d=(document.getElementById('ad')||{}).value||today();st.ad=d;(a==='appr'?pending().filter(x=>x.id===id):pending()).forEach(x=>{const nm=st.names[x.id];addTx({date:d,fund:x.p.fund,amt:R(x.p.dir==='in'?x.p.amt:-x.p.amt),cat:x.p.cat||x.p.name,desc:x.p.name+(nm?' – '+nm:' #'+x.i),src:x.id})})}
else if(a==='undo'){st.tx=st.tx.filter(t=>t.src!==id);save()}
else if(a==='copy'){const t=document.getElementById('bk');t.select();try{navigator.clipboard.writeText(t.value)}catch(_){}return}
else if(a==='restore'){try{const j=JSON.parse(document.getElementById('bk').value);if(!j.start||!j.tx)throw 0;st=j;save()}catch(_){return alert('That text is not a valid backup.')}}
else if(a==='reset'){if(!confirm('Erase all entries and settings?'))return;st=def();save()}
render()});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
if(d.s)st.start[d.s]=parseFloat(t.value)||0;
else if(d.b)st.budget[d.b]=parseFloat(t.value)||0;
else if(d.n)st.names[d.n]=t.value;
else if(d.t){const p=st.tpls.find(x=>x.id===d.t);const f=d.f;p[f]=(f==='amt')?(parseFloat(t.value)||0):(f==='count')?Math.max(0,parseInt(t.value)||0):t.value;if(f==='name'&&p.cat===undefined)p.cat=t.value}
else if(t.id==='lgf')lgF=t.value;else if(t.id==='lyf')lyF=t.value;else if(t.id==='ad')st.ad=t.value;else return;
save();render()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(p,p)}});
window.addEventListener('DOMContentLoaded', loadCloudData);

setInterval(() => {
  if (document.activeElement && document.activeElement.tagName === 'INPUT') return;
  loadCloudData();
}, 5000);

render();
</script></body></html>
